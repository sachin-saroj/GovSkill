services:
  db:
    image: postgres:16-alpine
    container_name: govskill-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govskill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govskill_pass_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-govskill}
    volumes:
      - govskill_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govskill_user} -d ${POSTGRES_DB:-govskill}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govskill-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed_admin &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      PROJECT_NAME: "GovSkill"
      API_V1_STR: "/api"
      SECRET_KEY: ${SECRET_KEY:-govskill-local-dev-jwt-secret-key-32charsmin!}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-govskill_user}:${POSTGRES_PASSWORD:-govskill_pass_dev_only}@db:5432/${POSTGRES_DB:-govskill}
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@govskill.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
    volumes:
      - govskill_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govskill-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  govskill_pgdata:
  govskill_uploads:
